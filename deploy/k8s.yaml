# RE100 PPA Simulator — 사내 k8s 배포 매니페스트
# 적용: kubectl apply -f deploy/k8s.yaml   (default 네임스페이스)
#
# ※ PVC 리소스 정의는 이 레포가 아닌 별도 위치에서 관리됨.
#   아래 Deployment의 claimName 을 실제 PVC 이름으로 교체할 것.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppa-dashboard
  labels: { app: ppa-dashboard }
spec:
  replicas: 1            # llm_config.json 파일 저장 구조 + RWO 볼륨 → 1 고정
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ppa-dashboard }
  template:
    metadata:
      labels: { app: ppa-dashboard }
    spec:
      containers:
        - name: app
          image: docker-repo.skhynix.com/esg/ppa-dashboard:1.0.0
          ports:
            - containerPort: 8700
          env:
            - name: PPA_PORT
              value: "8700"
            - name: PPA_DATA_DIR
              value: /data/input
            - name: PPA_LLM_CONFIG_PATH
              value: /data/llm_config.json
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /health, port: 8700 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8700 }
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ppa-dashboard-data   # ← 별도 관리되는 실제 PVC 이름으로 교체
---
apiVersion: v1
kind: Service
metadata:
  name: ppa-dashboard
spec:
  type: ClusterIP        # 외부 노출은 아래 Ingress로
  selector: { app: ppa-dashboard }
  ports:
    - port: 8700
      targetPort: 8700
---
# ─────────────────────────────────────────────────────────────
# Ingress (nginx, 경로 기반) — 필요 시 아래 주석을 해제하고 값 채우기
#
# 앱은 상대경로로 동작하도록 수정되어 있어 rewrite-target 없이도 동작하지만,
# 접속 시 반드시 경로 끝에 슬래시(/)를 붙여야 함 → 예: http://<도메인>/ppa/
# (슬래시 누락 대비용으로 아래 주석의 rewrite 방식도 함께 제공)
# ─────────────────────────────────────────────────────────────
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: ppa-dashboard
#   # annotations:
#   #   nginx.ingress.kubernetes.io/rewrite-target: /$2   # rewrite 방식 사용 시
# spec:
#   ingressClassName: nginx        # ← 사내 표준 클래스명 확인 후 교체
#   # tls:
#   #   - hosts: ["<도메인>"]
#   #     secretName: <TLS 인증서 시크릿 이름>
#   rules:
#     - host: <도메인>              # 예: apps.skhynix.com
#       http:
#         paths:
#           # [방식 1] 단순 prefix (앱이 상대경로라 그대로 동작)
#           - path: /ppa
#             pathType: Prefix
#             backend:
#               service:
#                 name: ppa-dashboard
#                 port: { number: 8700 }
#           # [방식 2] rewrite 사용 시 위 path 대신:
#           # - path: /ppa(/|$)(.*)
#           #   pathType: ImplementationSpecific
#           #   backend:
#           #     service: { name: ppa-dashboard, port: { number: 8700 } }
